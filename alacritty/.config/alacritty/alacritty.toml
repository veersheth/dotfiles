[env]
TERM = "screen-256color"

[font]
size = 16

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Semibold"

[window]
opacity = 0.60
decorations = "none"
dynamic_padding = true

[window.padding]
x = 14
y = 10

[window.dimensions]
columns = 140
lines = 80

[colors.primary]
background= '#000000'
foreground= '#ffffff'

[colors.normal]
black =   '#000000'
red =     '#ff5555'
green =   '#50fa7b'
yellow =  '#f1fa8c'
blue =    '#8be9fd'
magenta = '#ff79c6'
cyan =    '#19ffc9'
white =   '#ffffff'

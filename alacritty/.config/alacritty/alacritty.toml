[env]
TERM = "screen-256color"

[font]
size = 18

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
opacity = 0.9
decorations = "none"
dynamic_padding = true

[window.padding]
x = 12
y = 12

[colors.primary]
background= '#0e0e0e'
foreground= '#ffffff'

[colors.normal]
black =   '#000000'
red =     '#ff5555'
green =   '#50fa7b'
yellow =  '#f1fa8c'
blue =    '#bd93f9'
magenta = '#ff79c6'
cyan =    '#8be9fd'
white =   '#ffffff'

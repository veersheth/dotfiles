unbind r

unbind C-f
bind-key -r C-f run-shell "tmux neww ~/scripts/tmux-sessionizer"

bind r source-file ~/.tmux.conf
set-option -g set-clipboard on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set -g mouse on

# Pass current working directory to new windows
set-option -g default-command "exec zsh -l"
set-option -g update-environment "PWD"

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind | split-window -h
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf
bind -r m resize-pane -Z

# --------------------------------------------
# ----------- vim based splitting ------------
# --------------------------------------------

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'M-\' select-pane -l

# --------------------------------------------
# -------------  theme info  -----------------
# --------------------------------------------

set-option -g status-position bottom

set-option -g status-style "bg=default,fg=white"

set-option -g status-justify centre
set-window-option -g window-status-current-style "fg=#42ff5b"
set-window-option -g window-status-current-format " #I:#W "

set-window-option -g window-status-style "bg=default,fg=white"
set-window-option -g window-status-format " #I:#W "

set-option -g status-left ""
set-option -g status-right ""


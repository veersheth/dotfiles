set -a terminal-features "tmux-256color:RGB"
set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi
set -g mouse on

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

set-option -g set-clipboard on
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

bind e neww -n "yazi" yazi
bind E run-shell "nautilus . > /dev/null 2>&1 &"
bind g display-popup -d "#{pane_current_path}" -w 100% -h 100% -E "lazygit"
bind G run "~/scripts/github-webpage.sh"


bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10


bind-key -r C-f display-popup -E -w 60% -h 60% "~/scripts/tmux-sessionizer"
bind-key -r C-h switch-client -t "HOME"
bind-key -r C-t switch-client -t "TEMP"

set-option -g status-position top
set-option -g status-style "bg=default,fg=#707070"
set -g status-justify left

set -g status-left ""

set -g status-right "#[fg=#707070]#{b:pane_current_path} #[fg=#ffffff] #S"
set -g status-right-length 100

set-window-option -g window-status-current-style "fg=black,bold,bg=white"
set-window-option -g window-status-current-format " #I:#W "

set-window-option -g window-status-style "fg=#707070"
set-window-option -g window-status-format " #I:#W "

# vim tmux
bind -n 'M-\' run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys 'M-\\') || tmux select-pane -l"
bind M-l send-keys 'M-l'

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'M-\' select-pane -l

set -a terminal-features "tmux-256color:RGB"
bind-key -r C-f run-shell "tmux neww ~/scripts/tmux-sessionizer"
bind-key -r C-h switch-client -t 0

bind r source-file ~/.config/tmux/tmux.conf
set-option -g set-clipboard on
bind g neww -n "lazygit" lazygit
bind E show-environment -g

set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi

set-option -g status-position bottom

set-option -g status-style "bg=default,fg=white"

set -g status-right ""
set -g status-left "#S"
set -g status-justify absolute-centre
set-window-option -g window-status-current-style "fg=#f1fa8c"
set-window-option -g window-status-current-format " #I:#W "

set-window-option -g window-status-style "bg=default,fg=#909090"
set-window-option -g window-status-format " #I:#W "


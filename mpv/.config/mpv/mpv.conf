# Video output
vo=gpu
gpu-context=auto
hwdec=auto-safe

## Start fullscreen
# fs=yes
keep-open=yes          # keep window open after file ends
# osc=yes                # on-screen controls
osd-level=1            # show playback info on changes
osd-bar=yes            # volume/seek bar
osd-font-size=24

# Audio
volume=100              # start at 50%
volume-max=200         # allow going up to 200%
audio-normalize-downmix=yes

# Subtitles
sub-auto=fuzzy         # auto-load subs
sub-font-size=42
sub-color="#FFFFFF"
sub-border-color="#000000"
sub-border-size=2
sub-shadow-offset=1

# Behavior
save-position-on-quit   # resume playback where you left off
rebase-start-time=no    # show real timestamps

# Screenshot settings
screenshot-format=png
screenshot-directory=~/Pictures/mpv-screenshots

# Performance tweaks
cache=yes
demuxer-max-bytes=200M
demuxer-readahead-secs=20

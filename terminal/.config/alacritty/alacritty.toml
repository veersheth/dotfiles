[general]

[font]
size = 11

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[colors.primary]
background = "#101010"
foreground = "#fdfdfd"

[window]
opacity = 0.90
decorations = "None"

[window.padding]
x = 12
y = 12

[font.offset]
y = 4  
[font.glyph_offset]
y = 2  # roughly half of font.offset.y 


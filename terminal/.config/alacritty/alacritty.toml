
[general]
live_config_reload = true

[colors.primary]
background = "#101010"
foreground = "#FFFFFF"

[colors.cursor]
text = "#101010"
cursor = "#FFFFFF"

[colors.selection]
background = "#4d4c43"
text = "#FFFFFF"

[colors.normal]
black   = "#0f0f0f"
red     = "#e44e4e"
green   = "#89dc8c"
yellow  = "#dcd689"
blue    = "#7fbbb3"
magenta = "#d699b6"
cyan    = "#83c092"
white   = "#f0f0f0"

[colors.bright]
black   = "#859289"
red     = "#e67e80"
green   = "#a7c080"
yellow  = "#dbbc7f"
blue    = "#7fbbb3"
magenta = "#d699b6"
cyan    = "#83c092"
white   = "#d3c6aa"

[font]
size = 11.0

[font.normal]
family = "Maple Mono Normal NL CN"
style = "Regular"

[window]
opacity = 0.85
padding = { x = 24, y = 24 }
decorations = "None"

# [font.offset]
# y = 4  
# [font.glyph_offset]
# y = 2  # roughly half of font.offset.y 

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 700
blink_timeout = 131
thickness = 0.01

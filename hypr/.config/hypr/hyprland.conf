env = PATH,/home/veer/.nix-profile/bin:/etc/profiles/per-user/veer/bin:/run/current-system/sw/bin:/usr/local/bin:/usr/bin:/bin

exec-once = systemd-inhibit --who="Hyprland config" --why="Power key override" --what=handle-power-key --mode=block sleep infinity & echo $! > /tmp/.hyprland-systemd-inhibit
exec-shutdown = kill -9 "$(cat /tmp/.hyprland-systemd-inhibit)"

exec-once = dbus-update-activation-environment --systemd --all
bind  = , XF86PowerOff, exec, hyprlock

monitor=,preferred,auto,1

$terminal = kitty
$fileManager = nautilus
$settings = gnome-control center

exec-once = hypridle &
exec-once = hyprpaper &
exec-once = waybar &
exec-once = dunst &
exec-once = copyq &
exec-once = flameshot &
exec-once = ulauncher &
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

bind = SUPER SHIFT, W, exec, pkill waybar ; waybar &
bind = SUPER CTRL, W, exec, pkill hyprpaper; hyprpaper &

general {
    border_size = 0
    gaps_in = 2
    gaps_out = 0
    resize_on_border = true
    allow_tearing = false
    layout = master
    snap {
        enabled = true
    }
}

bind = SUPER, space, exec, hyprctl dispatch layoutmsg swapwithmaster

decoration {
    rounding = 4
    active_opacity = 1
    inactive_opacity = .90
    dim_inactive = true
    dim_strength = .1
    dim_special = .6

    shadow { 
        enabled = false
    }

    blur {
        enabled = true
        passes = 3
    }
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = been, 0.24, 0.9, 0.25, 0.91
    bezier = been2, 0,.94,.5,.99
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = slow, 0, 0.85, 0.3, 1
    bezier = overshot, 0.7, 0.6, 0.1, 1.1
    bezier = bounce, 1.1, 1.6, 0.1, 0.85
    bezier = sligshot, 1, -1, 0.15, 1.25
    bezier = nice, 0, 6.9, 0.5, -4.20
    
    animation = windowsIn, 1, 2, slow, popin
    animation = windowsOut, 1, 4, been, popin 70%
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 0, 1, linear
    animation = fade, 1, 2, overshot
    animation = workspaces, 1, 2, menu_decel
    animation = windows, 1, 5, bounce, popin
}

 windowrulev2 = noanim, class:^(flameshot)$

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
    smart_resizing = true
    mfact = .65
    new_on_active = true
    new_on_top = true
    special_scale_factor = 0.95
}

misc {
    disable_hyprland_logo = true 
    enable_swallow = true
    swallow_regex = (foot|kitty|alacritty|Alacritty)
    new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_rules = 

    follow_mouse = 1
    # accel_profile = flat
    sensitivity = 0.2 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        disable_while_typing = true
        natural_scroll = true
        scroll_factor = 0.4
        tap-and-drag = true
    }
}

gestures {
    workspace_swipe = true
}

device {
    name = 0274-touchpad
    sensitivity = 1
}


bind = SUPER, RETURN, exec, $terminal
bind = SUPER, q, killactive,
bind = SUPER SHIFT, DELETE, exit,
bind = SUPER, e, exec, $fileManager
bind = SUPER, t, togglefloating,
bind = SUPER SHIFT, t, exec, hyprctl dispatch workspaceopt allfloat
bind = ALT SHIFT, space, exec, rofi -show drun
bind = ALT, space, exec, ulauncher-toggle
bind = SUPER, P, pseudo
bind = SUPER, s, togglesplit
bind = SUPER, f, fullscreen
bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1

bind = SUPER, comma, exec, XDG_CURRENT_DESKTOP=GNOME gnome-control-center
bind = SUPER, V, exec, cliphist list | rofi --dmenu | cliphist decode | wl-copy
bind = SUPER, C, exec, ~/.config/hypr/scripts/toggle-hyprcaffeine.sh
bind = SUPER SHIFT, C, exec, hyprpicker -a
bind = SUPER, W, exec, ~/.config/hypr/scripts/starter.sh
bind = SUPER SHIFT, S, exec, USE_WAYLAND_GRIM=True flameshot gui
bind = SUPER SHIFT, Q, exec, hyprlock
bind = SUPER SHIFT, N, exec, sh ~/scripts/hyprsunset.sh

bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, j, movefocus, d
bind = SUPER, k, movefocus, u

bind = SUPER SHIFT, h, resizeactive, -50 0
bind = SUPER SHIFT, l, resizeactive, 50 0
bind = SUPER SHIFT, k, resizeactive, 0 -50
bind = SUPER SHIFT, j, resizeactive, 0 50

bind = SUPER CTRL, h, movewindow, l
bind = SUPER CTRL, l, movewindow, r
bind = SUPER CTRL, j, movewindow, d
bind = SUPER CTRL, k, movewindow, u

# Move focus with super + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER, grave, togglespecialworkspace, magic
bind = SUPER SHIFT, grave, movetoworkspace, special:magic

# Scroll through existing workspaces with SUPER + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER SHIFT, mouse:272, resizewindow

# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
# Volume up
bindel = ,XF86AudioRaiseVolume, exec, sh -c 'wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && VAL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}") && dunstify -r 999 -h int:value:$VAL "Volume"'

# Volume down
bindel = ,XF86AudioLowerVolume, exec, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && VAL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}") && dunstify -r 999 -h int:value:$VAL "Volume"'

# Mute toggle
bindel = ,XF86AudioMute, exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && MUTE=$(wpctl get-mute @DEFAULT_AUDIO_SINK@) && if [ "$MUTE" = "yes" ]; then dunstify -r 999 "🔇 Volume muted"; else VAL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}") && dunstify -r 999 -h int:value:$VAL "Volume"; fi'

# Mic mute toggle
bindel = ,XF86AudioMicMute, exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && MUTE=$(wpctl get-mute @DEFAULT_AUDIO_SOURCE@) && if [ "$MUTE" = "yes" ]; then dunstify -r 998 "🎤 Microphone muted"; else dunstify -r 998 "🎤 Microphone unmuted"; fi'

# Brightness up
bindel = ,XF86MonBrightnessUp, exec, sh -c 'brightnessctl set 5%+ && CUR=$(brightnessctl get) && MAX=$(brightnessctl max) && PCT=$((CUR * 100 / MAX)) && dunstify -r 997 -h int:value:$PCT "Brightness"'

# Brightness down
bindel = ,XF86MonBrightnessDown, exec, sh -c 'brightnessctl set 5%- && CUR=$(brightnessctl get) && MAX=$(brightnessctl max) && PCT=$((CUR * 100 / MAX)) && dunstify -r 997 -h int:value:$PCT "Brightness"'

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , switch:Lid Switch, exec, loginctl lock-session 

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

workspace = 6,gapsout:120

monitor=,preferred,auto,1

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

$terminal = wezterm
$files = nautilus

exec-once = nm-applet & blueman-applet &
# exec-once = hyprpaper &
exec-once = hypridle &
exec-once = hyprpanel &
exec-once = copyq &
exec-once = wl-paste --type text 
exec-once = wl-paste --type image 
exec-once = wl-paste --watch cliphist store &

exec-once = ~/scripts/battery-loop.sh

bind = SUPER CTRL, W, exec, sh -c 'if pgrep hyprpaper; then pkill hyprpaper; else hyprpaper & fi'

# auto launch
exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 2 silent] firefox
exec-once = [workspace 3 silent] obsidian
exec-once = [workspace 6 silent] spotify

general {
    border_size = 1
    col.active_border = rgba(77777788)
    col.inactive_border = rgba(66666688)
  
    gaps_in = 2
    gaps_out = 8

    resize_on_border = true
    allow_tearing = false
    snap:enabled = true
    layout = master
}

decoration {
    rounding = 12
    active_opacity = 1
    inactive_opacity = .90
    dim_inactive = false
    dim_strength = .25
    dim_special = .7
    shadow:enabled = false

    blur:enabled = true
    blur:passes = 3
    # layerrule = blur, waybar
}


animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.02
    bezier = menu_decel, 0.1, 1, 0.1, 1

    animation = windowsIn, 1, 4, menu_decel, slide
    animation = windowsOut, 1, 4 , menu_decel, slide
    animation = windowsMove, 1, 4, menu_decel
    animation = fade, 1, 2, menu_decel
    animation = borderangle, 0, 0, 0, 0
    animation = border, 0, 1, menu_decel
    # animation = workspaces, 1, 9, menu_decel, slidefade 2.5%
    animation = workspaces, 0, 4, menu_decel, slidefade 1%
    animation = specialWorkspace, 1, 4, menu_decel, slidefadevert 2%
}

dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
    mfact = 0.65
    smart_resizing = true
    special_scale_factor = 0.95
}

bind = SUPER, space, exec, hyprctl dispatch layoutmsg swapwithmaster

misc {
    disable_hyprland_logo = true
    enable_swallow = true
    swallow_regex = (foot|kitty|alacritty|Alacritty)
    new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
    vfr = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_rules = 

    follow_mouse = 1
    # accel_profile = flat
    sensitivity = 0.2 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        disable_while_typing = true
        natural_scroll = true
        scroll_factor = 0.4
        tap-and-drag = true
    }
}

gestures:workspace_swipe = true

device {
    name = 0274-touchpad
    sensitivity = 1
}

bind = SUPER, RETURN, exec, $terminal
bind = SUPER, B, exec, firefox
bind = SUPER, q, killactive,
bind = SUPER SHIFT, q, forcekillactive,
bind = SUPER SHIFT, DELETE, exit,
bind = SUPER, e, exec, $files

bind = SUPER SHIFT, f, togglefloating,
bind = SUPER CTRL, f, exec, hyprctl dispatch workspaceopt allfloat

bind = SUPER, P, pseudo
bind = SUPER, s, togglesplit
bind = SUPER, f, fullscreen, 1
bind = CTRL ALT, SPACE, exec, rofi -show drun -show-icons
bind = SUPER, period, exec, ~/scripts/rofi-emoji
bind = SUPER, V, exec, ~/scripts/rofi-clip

bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1

bind = ALT, TAB, workspace, previous
bind = ALT SHIFT, TAB, workspace, previous

bind = SUPER, comma, exec, XDG_CURRENT_DESKTOP=GNOME gnome-control-center

bind = SUPER SHIFT, C, exec, hyprpicker -a

# quick nvim writer
bind = SUPER, H, exec, wezterm start --class nvimfloat -e nvim ~/note.typst
windowrulev2 = float,class:(nvimfloat)
windowrulev2 = center,class:(nvimfloat)
windowrulev2 = pin, class:(nvimfloat)  # across workspaces

# screenshots
bind = , PRINT, exec, hyprshot -m region
bind = SUPER SHIFT, S, exec, hyprshot -m region
bind = SUPER, PRINT, exec, hyprshot -m output
bind = SUPER SHIFT, PRINT, exec, hyprshot -m window

bind = SUPER SHIFT, Q, exec, ~/scripts/rofi-powermenu
bind = SUPER CTRL, N, exec, bash ~/scripts/nightlight.sh
bind = SUPER CTRL, C, exec, bash ~/scripts/hypridle-caffeine-toggle.sh
bind = SUPER CTRL, P, exec, sh -c 'if pgrep play; then pkill play & notify-send -t 1000 "Pink noise" "disabled"; else play -nq synth pinknoise vol 0.10 & notify-send -t 1000 "Pink noise" "turned on" & fi'

# bind = SUPER, j, cyclenext
# bind = SUPER, k, cyclenext, prev

bind = SUPER, j, layoutmsg, cyclenext
bind = SUPER, k, layoutmsg, cycleprev

# bind = SUPER, h, layoutmsg, orientationleft
bind = SUPER, l, exec, hyprlock

bind = SUPER SHIFT, h, resizeactive, -50 0
bind = SUPER SHIFT, l, resizeactive, 50 0
bind = SUPER SHIFT, k, resizeactive, 0 -50
bind = SUPER SHIFT, j, resizeactive, 0 50

# bind = SUPER CTRL, h, movewindow, l
# bind = SUPER CTRL, l, movewindow, r
# bind = SUPER CTRL, j, movewindow, d
# bind = SUPER CTRL, k, movewindow, u

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# quick share 
bind = SUPER, s, exec, rquickshare
windowrulev2 = float, class:(rquickshare)

# NOTES (obsidian)
bind = SUPER, n, workspace, 3
bind = SUPER SHIFT, n, movetoworkspacesilent, 3

# MUSIC (apple/spotify)
bind = SUPER, m, workspace, 6
bind = SUPER SHIFT, m, movetoworkspacesilent, 6

bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT, 0, movetoworkspacesilent, 10

bind = SUPER, grave, togglespecialworkspace, magic
bind = SUPER SHIFT, grave, movetoworkspace, special:magic

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER SHIFT, mouse:272, resizewindow

bindel = CTRL, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SOURCE@ 5%+
bindel = CTRL, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


# making apps translucent
windowrulev2 = opacity 1 1,class:^(obsidian)$
windowrulev2 = opacity 1 1,class:^(org.pwmt.zathura)$


# quarry
bind = ALT, SPACE, exec, /home/veer/code/personal/quarry/src-tauri/target/debug/quarry-toggle
windowrulev2 = pin, class:^(quarry)$
windowrule = noborder, class:^(quarry)$
windowrulev2 = animation gnomed, class:^(quarry)$
windowrulev2 = noanim, class:^(quarry)$
# windowrulev2 =  noblur,class:^(quarry)$



exec-once = systemd-inhibit --who="Hyprland config" --why="Power key override" --what=handle-power-key --mode=block sleep infinity & echo $! > /tmp/.hyprland-systemd-inhibit
exec-shutdown = kill -9 "$(cat /tmp/.hyprland-systemd-inhibit)"
exec-once = dbus-update-activation-environment --systemd --all

bind = , XF86PowerOff, exec, sh -c 'notify-send -t 3000 "LMAO DUMBASS" "you thought"'
bind = SUPER, XF86PowerOff, exec, sh -c 'systemctl suspend'
bindl = , switch:Lid Switch, exec, sh -c 'if pgrep hyprlock; then echo do nothing; else hyprlock & fi'

monitor=,preferred,auto,1

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

$terminal = alacritty
$fileManager = nautilus
$settings = gnome-control center

exec-once = hypridle &
exec-once = hyprpaper &
exec-once = waybar &
exec-once = dunst &
exec-once = copyq &
exec-once = flameshot &
exec-once = ulauncher &
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/battery-low-check.sh

bind = SUPER SHIFT, W, exec, sh -c 'if pgrep waybar; then pkill waybar; else waybar & fi'
bind = SUPER CTRL, W, exec, sh -c 'if pgrep hyprpaper; then pkill hyprpaper; hyprctl keyword decoration:blur:enabled false; else hyprpaper & hyprctl keyword decoration:blur:enabled true; fi'
bind = SUPER CTRL, B, exec, sh -c 'CURRENT_STATE=$(hyprctl getoption decoration:blur:enabled -j | jq '.int'); if [ "$CURRENT_STATE" -eq 1 ]; then hyprctl keyword decoration:blur:enabled false; else hyprctl keyword decoration:blur:enabled true; fi'

# auto launch
exec-once = [workspace 1 silent] $terminal

general {
    border_size = 1
    col.active_border = rgba(555555ff)
    col.inactive_border = rgba(444444ff)
    gaps_in = 4
    gaps_out = 6
    resize_on_border = true
    allow_tearing = false
    snap:enabled = true
    layout = master
}

decoration {
    rounding = 12
    active_opacity = 1
    inactive_opacity = .9
    dim_inactive = false
    dim_strength = .25
    dim_special = .7
    shadow:enabled = false

    blur:enabled = true
    blur:passes = 3
    layerrule = blur, waybar
}


animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.02
    bezier = menu_decel, 0.1, 1, 0.1, 1

    animation = windowsIn, 1, 4, menu_decel, slidefade
    animation = windowsOut, 1, 4 , menu_decel, slidefade
    animation = windowsMove, 1, 3, menu_decel
    animation = border, 0, 1, menu_decel
    animation = fade, 1, 2, menu_decel
    animation = borderangle, 0, 0, 0, 0

    animation = workspaces, 1, 2, menu_decel, slidefade 2%
    animation = windows, 1, 5, menu_decel, popin
    animation = specialWorkspace, 1, 4, menu_decel, slidefadevert 2%
}

dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
    # smart_resizing = true
    mfact = .65
    special_scale_factor = 0.95
}

bind = SUPER, space, exec, hyprctl dispatch layoutmsg swapwithmaster

misc {
    disable_hyprland_logo = true
    enable_swallow = true
    swallow_regex = (foot|kitty|alacritty|Alacritty|gimp|zen)
    new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
    vfr = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_rules = 

    follow_mouse = 1
    # accel_profile = flat
    sensitivity = 0.2 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        disable_while_typing = true
        natural_scroll = true
        scroll_factor = 0.4
        tap-and-drag = true
    }
}

gestures:workspace_swipe = true

device {
    name = 0274-touchpad
    sensitivity = 1
}

bind = SUPER, RETURN, exec, $terminal
bind = SUPER, q, killactive,
bind = SUPER SHIFT, DELETE, exit,
bind = SUPER, e, exec, $fileManager
bind = SUPER, t, togglefloating,
bind = SUPER SHIFT, t, exec, hyprctl dispatch workspaceopt allfloat
bind = ALT SHIFT, space, exec, ulauncher-toggle
# bind = ALT, space, exec, rofi -show drun
bind = SUPER, P, pseudo
bind = SUPER, s, togglesplit
bind = SUPER, f, fullscreen

bind = ALT, SPACE, exec, tofi-drun --drun-launch=true
bind = SUPER, period, exec, ~/scripts/tofi-emoji
bind = SUPER, period, exec, ~/.config/hypr/scripts/rofi-emojis.sh
bind = SUPER SHIFT, V, exec, ~/scripts/tofi-clip

bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1

bind = ALT, TAB, workspace, previous
bind = ALT SHIFT, TAB, workspace, previous

bind = SUPER, comma, exec, XDG_CURRENT_DESKTOP=GNOME gnome-control-center
bind = SUPER, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = SUPER, C, exec, ~/.config/hypr/scripts/toggle-hyprcaffeine.sh
bind = SUPER SHIFT, C, exec, hyprpicker -a
bind = SUPER SHIFT, S, exec, flameshot gui
bind = SUPER SHIFT, Q, exec, hyprlock
bind = SUPER SHIFT, N, exec, bash ~/scripts/nightlight.sh
bind = SUPER SHIFT, P, exec, sh -c 'if pgrep play; then pkill play & notify-send -t 1000 "Pink noise" "disabled"; else play -nq synth pinknoise vol 0.10 & notify-send -t 1000 "Pink noise" "turned on" & fi'

bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, j, movefocus, d
bind = SUPER, k, movefocus, u

bind = SUPER SHIFT, h, resizeactive, -50 0
bind = SUPER SHIFT, l, resizeactive, 50 0
bind = SUPER SHIFT, k, resizeactive, 0 -50
bind = SUPER SHIFT, j, resizeactive, 0 50

bind = SUPER CTRL, h, movewindow, l
bind = SUPER CTRL, l, movewindow, r
bind = SUPER CTRL, j, movewindow, d
bind = SUPER CTRL, k, movewindow, u

# control brightness/volume w super arrow keys
bind = SUPER, up, exec, sh -c 'brightnessctl set 5%+ && CUR=$(brightnessctl get) && MAX=$(brightnessctl max) && PCT=$((CUR * 100 / MAX)) && dunstify -t 400 -r 997 -h int:value:$PCT "Brightness"'
bind = SUPER, down, exec, sh -c 'brightnessctl set 5%- && CUR=$(brightnessctl get) && MAX=$(brightnessctl max) && PCT=$((CUR * 100 / MAX)) && dunstify -t 400 -r 997 -h int:value:$PCT "Brightness"'
bind = SUPER, left, exec, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && VAL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}") && dunstify -t 400 -r 999 -h int:value:$VAL "Volume"'
bind = SUPER, right, exec, sh -c 'wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && VAL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}") && dunstify -t 400 -r 999 -h int:value:$VAL "Volume"'

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT, 0, movetoworkspacesilent, 10

bind = SUPER, grave, togglespecialworkspace, magic
bind = SUPER SHIFT, grave, movetoworkspace, special:magic

# Scroll through existing workspaces with SUPER + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER SHIFT, mouse:272, resizewindow

# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindel = ,XF86AudioRaiseVolume, exec, sh -c 'wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && VAL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}") && dunstify -t 400 -r 999 -h int:value:$VAL "Volume"'
bindel = ,XF86AudioLowerVolume, exec, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && VAL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}") && dunstify -t 400 -r 999 -h int:value:$VAL "Volume"'
bindel = ,XF86AudioMute, exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send -t 400 "Volume Muted"'
bindel = ,XF86AudioMicMute, exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && MUTE=$(wpctl get-mute @DEFAULT_AUDIO_SOURCE@) && if [ "$MUTE" = "yes" ]; then dunstify -t 400 -r 998 "🎤 Microphone muted"; else dunstify -t 400 -r 998 "🎤 Microphone unmuted"; fi'
bindel = ,XF86MonBrightnessUp, exec, sh -c 'brightnessctl set 5%+ && CUR=$(brightnessctl get) && MAX=$(brightnessctl max) && PCT=$((CUR * 100 / MAX)) && dunstify -t 400 -r 997 -h int:value:$PCT "Brightness"'
bindel = ,XF86MonBrightnessDown, exec, sh -c 'brightnessctl set 5%- && CUR=$(brightnessctl get) && MAX=$(brightnessctl max) && PCT=$((CUR * 100 / MAX)) && dunstify -t 400 -r 997 -h int:value:$PCT "Brightness"'

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# making apps translucent
windowrulev2 = opacity 0.9 0.9,class:^(obsidian)$
windowrulev2 = opacity 0.9 0.9,class:^(org.pwmt.zathura)$
windowrulev2 = size 900 500, class:^(ulauncher)$
windowrulev2 = float, class:^(ulauncher)$

# # smart gaps
# workspace = w[tv1]s[false], gapsout:0, gapsin:0
# workspace = f[1]s[false], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]s[false]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]s[false]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]s[false]
# windowrule = rounding 0, floating:0, onworkspace:f[1]s[false]

windowrulev2 = noanim, class:^flameshot$
windowrulev2 = animation gnomed, class:^ulauncher$

exec-once = systemd-inhibit --who="Hyprland config" --why="wlogout keybind" --what=handle-power-key --mode=block sleep infinity & echo $! > /tmp/.hyprland-systemd-inhibit
exec-shutdown = kill -9 "$(cat /tmp/.hyprland-systemd-inhibit)

bind  = , XF86PowerOff, exec, ~/.config/hypr/scripts/lock-then-suspend.sh

# Refer to the wiki for more information.
# This is an example Hyprland config file.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$browser = firefox
$fileManager = nautilus
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
# exec-once = dunst
exec-once = swaync
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = clipman daemon
exec-once = copyq
exec-once = ulauncher --hide-window

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 0
    border_size = 0
    # col.active_border = rgba(255, 255, 255)
    # col.inactive_border = rgba(0, 0, 0)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1
    inactive_opacity = 1
    dim_inactive = true
    dim_strength = 0.1

    shadow { 
        enabled = false 
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    # blur {
    #     enabled = true
    #     size = 2
    #     passes = 3
    #     vibrancy = 0.1696
    # }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes                                             

    bezier = easeOutQuint,0.23,1,0.32,1                         
    bezier = easeInOutCubic,0.65,0.05,0.36,1                    
    bezier = linear,0,0,1,1                                     
    bezier = almostLinear,0.5,0.5,0.75,1.0                      
    bezier = quick,0.15,0,0.1,1                                 

    animation = global, 0.1, 10, default                        
    animation = windows, 1, 4.79, easeOutQuint                  
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%      
    animation = windowsOut, 1, 1.49, linear, popin 87%          
    animation = layers, 1, 3.81, easeOutQuint                   
    animation = layersIn, 1, 4, easeOutQuint, fade              
    animation = layersOut, 1, 1.5, linear, fade                 
    animation = fadeLayersIn, 1, 1.79, almostLinear             
    animation = fadeLayersOut, 1, 1.39, almostLinear            
    animation = workspaces, 1, 0.2, almostLinear, fade          
    animation = workspacesIn, 1, 0.2, almostLinear, fade        
    animation = workspacesOut, 1, 0.2, almostLinear, fade       
}


# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape_shifted_capslock
    kb_rules =

    follow_mouse = 1
    # accel_profile = flat
    sensitivity = 0.2 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        disable_while_typing = true
        natural_scroll = true
        scroll_factor = 0.6
        tap-and-drag = true
    }
}

gestures {
    workspace_swipe = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = 0274-touchpad
    sensitivity = 1
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

bind = SUPER, RETURN, exec, $terminal
bind = SUPER, q, killactive,
bind = SUPER SHIFT, DELETE, exit,
bind = SUPER, e, exec, $fileManager
bind = SUPER, t, togglefloating,
bind = SUPER SHIFT, t, exec, hyprctl dispatch workspaceopt allfloat
bind = SUPER, space, exec, ulauncher-toggle
bind = SHIFT ALT, space, exec, wofi 
bind = ALT, space, exec, ulauncher-toggle
bind = SUPER, P, pseudo, # dwindle
bind = SUPER, s, togglesplit, # dwindle
bind = SUPER, f, fullscreen
bind = ALT, Tab, cyclenext
bind = SUPER, B, exec, $browser
bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1

bind = SUPER SHIFT, N , exec , ~/.config/hypr/scripts/toggle-nightlight.sh
bind = SUPER SHIFT, Q, exec, hyprlock
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot-area.sh
bind = SHIFT, PRINT,exec, grimshot save screen - | wl-copy && notify-send "Screenshot-ted"
bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = SUPER, C, exec, hyprpicker -a

# Move focus with SUPER + arrow keys
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, j, movefocus, d
bind = SUPER, k, movefocus, u

bind = SUPER SHIFT, h, resizeactive, -50 0
bind = SUPER SHIFT, l, resizeactive, 50 0
bind = SUPER SHIFT, k, resizeactive, 0 -50
bind = SUPER SHIFT, j, resizeactive, 0 50

# Move focus with super + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad) use super + `
bind = SUPER, grave, togglespecialworkspace, magic
bind = SUPER SHIFT, grave, movetoworkspace, special:magic

# Scroll through existing workspaces with SUPER + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER SHIFT, mouse:272, resizewindow

# Laptop multimedia keys for volume and LCD brightness with visual indicators
# Volume Up
bindel = ,XF86AudioRaiseVolume, exec, sh -c 'wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && VOL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}") && BARS=$((VOL / 10)) && BAR=$(printf "%0.s█" $(seq 1 $BARS)) && EMPTY=$((10 - BARS)) && BAR="$BAR$(printf "%0.s░" $(seq 1 $EMPTY))" && notify-send -t 500 "Volume: [$BAR] $VOL%"'

# Volume Down
bindel = ,XF86AudioLowerVolume, exec, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && VOL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}") && BARS=$((VOL / 10)) && BAR=$(printf "%0.s█" $(seq 1 $BARS)) && EMPTY=$((10 - BARS)) && BAR="$BAR$(printf "%0.s░" $(seq 1 $EMPTY))" && notify-send -t 500 "Volume: [$BAR] $VOL%"'

# Volume Mute Toggle
bindel = ,XF86AudioMute, exec, sh -c 'MUTE=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | grep -q MUTED && echo "Muted" || echo "Unmuted") && wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send -t 500 "Volume: $MUTE"'

# Mic Mute Toggle
bindel = ,XF86AudioMicMute, exec, sh -c 'MUTE=$(wpctl get-volume @DEFAULT_AUDIO_SOURCE@ | grep -q MUTED && echo "Muted" || echo "Unmuted") && wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && notify-send -t 500 "Microphone: $MUTE"'

# Brightness Up
bindel = ,XF86MonBrightnessUp, exec, sh -c 'brightnessctl set 5%+ && BRIGHT=$(brightnessctl get) && MAX=$(brightnessctl max) && PERC=$((BRIGHT * 100 / MAX)) && BARS=$((PERC / 10)) && BAR=$(printf "%0.s█" $(seq 1 $BARS)) && EMPTY=$((10 - BARS)) && BAR="$BAR$(printf "%0.s░" $(seq 1 $EMPTY))" && notify-send -t 500 "Brightness: [$BAR] $PERC%"'

# Brightness Down
bindel = ,XF86MonBrightnessDown, exec, sh -c 'brightnessctl set 5%- && BRIGHT=$(brightnessctl get) && MAX=$(brightnessctl max) && PERC=$((BRIGHT * 100 / MAX)) && BARS=$((PERC / 10)) && BAR=$(printf "%0.s█" $(seq 1 $BARS)) && EMPTY=$((10 - BARS)) && BAR="$BAR$(printf "%0.s░" $(seq 1 $EMPTY))" && notify-send -t 500 "Brightness: [$BAR] $PERC%"'

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bindl = , switch:Lid Switch, exec, loginctl lock-session


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

#############################
###### ulauncher rules ######
#############################

# Make it float and remove border
windowrulev2 = float,class:^(ulauncher)$
windowrulev2 = noborder,class:^(ulauncher)$

#############################
###### TextEdit rules ######
#############################

bind = SUPER, N, exec, gnome-text-editor
windowrule = float, class:org.gnome.TextEditor 
windowrule = size 660 900, class:org.gnome.TextEditor 

#############################
#### workspace 10 rules #####
#############################
windowrulev2 = float,workspace:10
windowrulev2 = size 80% 75%,workspace:10
windowrulev2 = center,workspace:10


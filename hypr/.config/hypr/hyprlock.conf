background {
    monitor = 
}
 
input-field {
    monitor =
    size = 230, 55
    outline_thickness = 14
    dots_size = 0.33 
    dots_spacing = 0.15 
    dots_center = true
    dots_rounding = -1 
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    hide_input = false
    rounding = -1 
    check_color = rgb(245, 233, 66)
    fail_color = rgb(204, 34, 34) 
    fail_text = $FAIL ($ATTEMPTS)
    fail_transition = 300 
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 
    invert_numlock = false 
    swap_font_color = false 
    position = 0, -20
    halign = center
    valign = center
}
 
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}
 
label {
    monitor =
    text = $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 26
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}



background {
    monitor =
    path = ~/.config/hypr/wallpapers/main.jpg
    blur_passes = 1              
    brightness = 0.4             
}

input-field {
    monitor = 
    size = 200, 50
    position = 0, -50              
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = true
    hide_input = false
}

general {
    no_fade_in = false
    ignore_empty_input = false
}


label {
    monitor =
    text = $USER
    position = 0, 20            
    halign = center
    valign = center
    font_family = monospace
    font_size = 20
    color = rgba(ffffffee)        
}


label {
    monitor = 
    text = cmd[1000]:date +%H:%M:%S
    position = 0, -20             
    halign = center
    valign = bottom
    font_family = monospace
    font_size = 28
    color = rgba(ffffffee)
}

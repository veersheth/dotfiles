background {
    monitor =
    path = /home/veer/wallpapers/something.jpg
    blur_passes = 3              
    brightness = 0.2             
    vignette = true
}
#
input-field {
    monitor = 
    size = 200, 50
    position = 0, -50              
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = true
    hide_input = false
}

general {
    ignore_empty_input = false
}


label {
    monitor =
    text = $USER
    position = 0, 20            
    halign = center
    valign = center
    font_family = monospace
    font_size = 20
    color = rgba(ffffffee)        
    shadow_color = rgba(000000aa)      
}

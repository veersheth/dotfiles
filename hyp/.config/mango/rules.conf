# Utility windows stay floating. Hyprland's pinned windows become global windows
# so they remain visible when switching tags.
window_rule=is_floating:1,is_global:1,title:^Picture-in-Picture$
window_rule=is_floating:1,is_global:1,no_animation:1,animation_type_open:none,animation_type_close:none,app_id:^quarry$
window_rule=is_floating:1,is_global:1,app_id:.*LiveCaptions.*
window_rule=is_floating:1,app_id:.*NautilusPreviewer.*
window_rule=is_floating:1,is_global:1,app_id:.*satty.*

# Let Quickshell animate its own bar, notifications, OSD, and dock.
layer_rule=no_animation:1,no_blur:1,layer_name:^quickshell:.*

# Keep windows visible beneath slurp's region-selection overlay.
layer_rule=no_animation:1,no_blur:1,layer_name:^selection$


var=term,foot
var=editor,nvim
var=browser,firefox

# Applications and system
bind=SUPER,Return,spawn,$term
bind=SUPER,B,spawn,$browser
bind=SUPER,comma,spawn,hypr-settings
bind=SUPER+ALT,E,spawn,nautilus
bind=SUPER+CTRL,E,spawn,$term -e $editor
bind=SUPER+SHIFT,W,spawn,~/.config/mango/scripts/restart-shell.sh
bind=SUPER+SHIFT,D,spawn,~/.config/mango/scripts/toggle-color-scheme.sh
bind=ALT,space,spawn,/home/veer/code/quarry/src-tauri/target/release/quarry-toggle
bind=SUPER,V,spawn_shell,/home/veer/code/quarry/src-tauri/target/release/quarry --with 'cp '
bind=SUPER+CTRL,G,spawn,/home/veer/scripts/gamemode
bind=NONE,Print,spawn,~/.config/mango/scripts/screenshot.sh region
bind=SHIFT,Print,spawn,~/.config/mango/scripts/screenshot.sh annotate
bind=CTRL,Print,spawn,~/.config/mango/scripts/screenshot.sh ocr
bind=SUPER,Print,spawn,~/.config/mango/scripts/screenshot.sh output
bind=ALT,Print,spawn,~/.config/mango/scripts/screenshot.sh lens
bind=SUPER,XF86MonBrightnessUp,spawn,~/.config/mango/scripts/nightlight

# Windows and focus
bindr=SUPER,Super_L,spawn,/home/veer/code/quarry/src-tauri/target/release/quarry-toggle
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER,F,set_proportion,1.0
bind=SUPER,T,togglefloating
bind=SUPER,space,zoom
bind=SUPER+SHIFT,H,resizewin,-50,0
bind=SUPER+SHIFT,J,resizewin,0,50
bind=SUPER+SHIFT,K,resizewin,0,-50
bind=SUPER+SHIFT,L,resizewin,50,0

bind=SUPER,j,focusstack,prev
bind=SUPER,k,focusstack,next
bind=SUPER,u,focuslast
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# Tags (Mango's equivalent of workspaces)
bind=SUPER,Tab,viewtoright
bind=SUPER+SHIFT,Tab,viewtoleft
bind=ALT,Tab,view,-1,0
# bind = ALT,Tab, overcircle
# bind = ALT, Tab, togglejump


bind=SUPER,grave,toggle_special_tag
bind=SUPER+SHIFT,grave,tag_special_tag
bind=SUPER+CTRL,j,focusmon,next
bind=SUPER+CTRL,k,focusmon,prev

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,N,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,E,view,5,0
bind=SUPER,M,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,N,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,E,tag,5,0
bind=SUPER+SHIFT,M,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Media and hardware keys
bindl=NONE,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/volume-notify.sh 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,~/.config/mango/scripts/volume-notify.sh 5%-
bindl=NONE,XF86AudioMute,spawn,~/.config/mango/scripts/volume-notify.sh --mute
bindl=NONE,XF86AudioMicMute,spawn,~/.config/mango/scripts/volume-notify.sh --mute @DEFAULT_AUDIO_SOURCE@
bindl=NONE,XF86MonBrightnessUp,spawn,~/.config/mango/scripts/brightness.sh up
bindl=NONE,XF86MonBrightnessDown,spawn,~/.config/mango/scripts/brightness.sh down
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous


# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER+SHIFT,btn_left,moveresize,curresize
mousebind=alt,btn_middle,set_proportion,0.5
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen

# Gesturebind
gesturebind=none,right,3,viewprev_have_client
gesturebind=none,left,3,viewnext_have_client
gesturebind=none,up,3,toggleoverview,1
gesturebind=none,down,3,leaveoverview
gesturebind=none,right,4,focusdir,left
gesturebind=none,left,4,focusdir,right
gesturebind=none,up,4,toggleoverview


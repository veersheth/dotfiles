source=./hypr-settings-monitors.conf
### AESTHETICS

## Effect
blur=2
blur_layer=2
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 7
blur_params_noise = 0.02
blur_params_brightness = 0.7
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 0
shadow_only_floating=0
shadows_size = 4
shadows_blur = 8
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x00000020

border_radius=6
no_radius_when_single=0
focused_opacity=1
unfocused_opacity=1

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=fade
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.8
fade_out_begin_opacity=0.8
animation_duration_move=180
animation_duration_open=180
animation_duration_tag=180
animation_duration_close=140
animation_duration_focus=100
animation_curve_open=0.22,1,0.36,1
animation_curve_move=0.22,1,0.36,1
animation_curve_tag=0.22,1,0.36,1
animation_curve_close=0.4,0,1,1
animation_curve_focus=0.22,1,0.36,1
animation_curve_opacity_fade_in=0.22,1,0.36,1
animation_curve_opacity_fade_out=0.4,0,1,1

# Misc
xwayland_persistence=1
sync_obj_enable=1
no_border_when_single=0
axis_bind_apply_timeout=100
trackpad_natural_scrolling=1
trackpad_scroll_factor=0.4
drag_lock=0
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=scroller,tile
scroller_default_proportion=0.5
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
scroller_prefer_overspread=0
scroller_structs=4
default_master_factor=0.5
enable_floating_snap=1
snap_distance=50
cursor_size=24
cursor_theme=Bibata-Modern-Ice
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad = 1

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=4
gap_outer_vertical=4
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=1
root_color=0x201b14ff
border_color=0x404040ff # border inactive
focus_color=0x707070ff # border active
drop_color=0x30303055
split_color=0x303030ff
maximized_screen_color=0x303030ff
urgent_color=0x303030ff
scratchpad_color=0x303030ff
global_color=0x303030ff
overlay_color=0x303030ff





source=./monitor.conf
source=./bind.conf
source=./rules.conf

tag_rule=id:*,layout_name:scroller

# Same active startup services as the Hyprland session.
exec_once= quickshell
exec_once= hypridle --config /home/veer/.config/mango/hypridle.conf
exec_once = sh -c "$HOME/scripts/mount-onedrive.sh

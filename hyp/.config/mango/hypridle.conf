general {
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = loginctl lock-session; qs ipc call lock lock; qs ipc call lock pause
    after_sleep_cmd = qs ipc call lock resume; sleep 1 && mmsg dispatch wakeup_monitor,eDP-1
}

# Dim the Framework keyboard backlight after 30 seconds.
listener {
    timeout = 30
    ignore_inhibit = true
    on-timeout = brightnessctl -q -c leds -d 'framework_laptop::kbd_backlight' -s set 0
    on-resume = brightnessctl -q -c leds -d 'framework_laptop::kbd_backlight' -r
}

# Dim the panel after four minutes, preserving a lower brightness setting.
listener {
    timeout = 240
    on-timeout = /home/veer/.config/mango/scripts/brightness.sh idle-dim
    on-resume = brightnessctl -q -c backlight -r
}

listener {
    timeout = 420
    on-timeout = loginctl lock-session
}

listener {
    timeout = 450
    on-timeout = mmsg dispatch sleep_monitor,eDP-1
    on-resume = mmsg dispatch wakeup_monitor,eDP-1
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}

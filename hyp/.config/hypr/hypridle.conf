general {
    lock_cmd         = qs ipc call lock lock   # quickshell lock; re-locking while locked is a no-op
    before_sleep_cmd = loginctl lock-session; qs ipc call lock pause
    after_sleep_cmd  = sleep 1 && hyprctl dispatch dpms on && qs ipc call lock resume
}

# Dim screen after 4 min
listener {
    timeout  = 240
    on-timeout = touch /tmp/.qs-idle-dim && brightnessctl -s set 10%
    on-resume  = brightnessctl -r; rm -f /tmp/.qs-idle-dim
}

# Lock after 7 min
listener {
    timeout  = 420
    on-timeout = loginctl lock-session
}

# Turn off display 30s after locking
listener {
    timeout  = 450
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend after 15 min
listener {
    timeout  = 900
    on-timeout = systemctl suspend
}

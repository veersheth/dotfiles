general {
    # lock_cmd         = qs ipc call lock lock   # quickshell lock; re-locking while locked is a no-op
    lock_cmd         = qs ipc call lock lock
    before_sleep_cmd = loginctl lock-session; qs ipc call lock lock; qs ipc call lock pause
    after_sleep_cmd  = qs ipc call lock resume; sleep 1 && hyprctl dispatch dpms on 
}

# Turn off the Framework keyboard backlight after 30s without keyboard/mouse input.
# Restore its previous brightness on activity (including leaving it off if it was off).
listener {
    timeout = 30
    # Media should keep the screen awake, but not the keyboard backlight.
    ignore_inhibit = true
    on-timeout = brightnessctl -q -c leds -d 'framework_laptop::kbd_backlight' -s set 0
    on-resume = brightnessctl -q -c leds -d 'framework_laptop::kbd_backlight' -r
}

# Dim screen to at most 10% after 4 min; preserve lower brightness levels.
listener {
    timeout  = 240
    on-timeout = touch /tmp/.qs-idle-dim && ~/.config/hypr/scripts/brightness.sh idle-dim
    on-resume  = brightnessctl -q -c backlight -r; rm -f /tmp/.qs-idle-dim
}

# Lock after 7 min
listener {
    timeout  = 420
    on-timeout = loginctl lock-session
}

# Turn off display 30s after locking
listener {
    timeout  = 450
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend after 15 min
listener {
    timeout  = 900
    on-timeout = systemctl suspend
}

general {
    lock_cmd         = pidof hyprlock || hyprlock   # don't spawn duplicate locks
    before_sleep_cmd = loginctl lock-session         # lock on suspend
    after_sleep_cmd  = hyprctl dispatch dpms on      # wake display on resume
}

# Dim screen after 4 min
listener {
    timeout  = 240
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# Lock after 7 min
listener {
    timeout  = 420
    on-timeout = loginctl lock-session
}

# Turn off display 30s after locking
listener {
    timeout  = 450
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend after 15 min
listener {
    timeout  = 900
    on-timeout = systemctl suspend
}

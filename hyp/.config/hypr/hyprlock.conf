# ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = false
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
    screencopy_mode = 0
    fail_timeout = 2000
}

animations {
    enabled = false
}

auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
}

background {
    monitor =
    path = /home/veer/Downloads/nasa1.png
    blur_passes = 4
    blur_size = 6
    # color = rgba(12, 12, 14, 1.0)
}

# Time
label {
    monitor =
    text = cmd[update:1000] date '+%-I:%M %p'
    color = rgba(235, 235, 235, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(160, 160, 165, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0,0
    halign = center
    valign = center
}


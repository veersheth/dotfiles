# Password
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    rounding = 27
    inner_color = rgba(25, 25, 28, 0.90)
    outer_color = rgba(90, 90, 95, 0.8)
    font_color = rgba(220, 220, 225, 1.0)
    font_family = JetBrainsMono Nerd Font
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##88888f">Password</span>
    fail_text = <span foreground="##e07070">BITCH</span>
    position = 0, -80
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:10000] STATUS=$(cat /sys/class/power_supply/BAT1/status); CAP=$(cat /sys/class/power_supply/BAT1/capacity); [ "$STATUS" = "Charging" ] && echo "Charging  $CAP%" || echo "$CAP%"
    color = rgba(160, 160, 165, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = bottom
}

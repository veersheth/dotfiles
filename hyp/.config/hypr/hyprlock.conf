general {
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
    disable_loading_bar = true
}

auth {
    fingerprint {
        enabled         = true
        ready_message   = Touch fingerprint sensor
        present_message = Scanning...
        error_message   = Not recognized
    }
}

# Blurred screenshot background
background {
    monitor    =
    path       = screenshot
    blur_passes = 4
    blur_size  = 6
    brightness = 0.8
}


# Time
label {
    monitor     =
    text        = cmd[update:1000] date +"%H%M"
    color       = rgba(255, 255, 255, 0.2)
    background  = rgba(255, 0 , 0, 1)
    font_size   = 556
    font_family = Iosevka Nerd Font, Black
    position    = 0, 0
    halign      = center
    valign      = center
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %B %-d"
    color       = rgba(255, 255, 255, 0.5)
    font_size   = 18
    font_family = Inter
    position    = 50, -50
    halign      = left
    valign      = top
}

# Battery
label {
    monitor     =
    text        = cmd[update:10000] STATUS=$(cat /sys/class/power_supply/BAT1/status); CAP=$(cat /sys/class/power_supply/BAT1/capacity); [ "$STATUS" = "Charging" ] && BOLT="Charging " || BOLT=""; echo "$BOLT$CAP%"
    color       = rgba(255, 255, 255, 0.5)
    font_size   = 18
    font_family = Inter
    position    = -50, -50
    halign      = right
    valign      = top
}

# Password / fingerprint input field
# Password / fingerprint input field
input-field {
    monitor          =
    size             = 280, 52
    outline_thickness = 2
    dots_size        = 0.28
    dots_spacing     = 0.2
    dots_center      = true
    outer_color      = rgba(ffffff33)
    inner_color      = rgba(00000088)
    font_color       = rgba(ffffffdd)
    fade_on_empty    = false
    check_color      = rgba(a0e8a0cc)
    fail_color       = rgba(e88080cc)
    fail_text        = BITCH
    placeholder_text = what
    capslock_color   = rgba(e8e880cc)
    position         = 0, 90
    halign           = center
    valign           = bottom
}


# ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = false
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
    screencopy_mode = 0
    fail_timeout = 2000
}

auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
}

background {
    monitor =
    color = rgba(12, 12, 14, 1.0)
}

# Time
label {
    monitor =
    text = cmd[update:1000] date '+%-I:%M %p'
    color = rgba(235, 235, 235, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font

    position = 0, 110
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(160, 160, 165, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, 35
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = rgba(190, 190, 195, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, -55
    halign = center
    valign = center
}

# Password
input-field {
    monitor =

    size = 320, 54
    outline_thickness = 1
    rounding = 27

    inner_color = rgba(25, 25, 28, 0.90)
    outer_color = rgba(90, 90, 95, 0.8)

    font_color = rgba(220, 220, 225, 1.0)
    font_family = JetBrainsMono Nerd Font

    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false

    placeholder_text = <span foreground="##88888f">Password</span>
    fail_text = <span foreground="##e07070">$FAIL</span>

    position = 0, -125
    halign = center
    valign = center
}





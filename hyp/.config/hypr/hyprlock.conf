general {
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
    disable_loading_bar = true
}

auth {
    fingerprint {
        enabled         = true
        ready_message   = Touch fingerprint sensor
        present_message = Scanning...
        error_message   = Not recognized
    }
}

# Blurred screenshot background
background {
    monitor    =
    path       = screenshot
    blur_passes = 4
    blur_size  = 6
    brightness = 0.8
}

# Time
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgba(ffffff, 0.92)
    font_size   = 16
    font_family = JetBrainsMono Nerd Font
    position    = 310, 280
    halign      = center
    valign      = center
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %B %-d"
    color       = rgba(ffffff, 0.65)
    font_size   = 16
    font_family = JetBrainsMono Nerd Font
    position    = -350, 190
    halign      = center
    valign      = center
}

# Battery 
label {
    monitor     =
    text        = cmd[update:10000] STATUS=$(cat /sys/class/power_supply/BAT1/status); CAP=$(cat /sys/class/power_supply/BAT1/capacity); echo "$STATUS $CAP%"
    color       = rgba(ffffff, 0.55)
    font_size   = 16
    font_family = JetBrainsMono Nerd Font
    position    = 150, -300
    halign      = center
    valign      = center
}

# Password / fingerprint input field
input-field {
    monitor          =
    size             = 280, 52
    outline_thickness = 2
    dots_size        = 0.28
    dots_spacing     = 0.2
    dots_center      = true
    outer_color      = rgba(ffffff33)
    inner_color      = rgba(00000088)
    font_color       = rgba(ffffffdd)
    fade_on_empty    = false
    check_color      = rgba(a0e8a0cc)
    fail_color       = rgba(e88080cc)
    fail_text        = BITCH
    capslock_color   = rgba(e8e880cc)
    position         = 0, -30
    halign           = center
    valign           = center
}

label {
    monitor     =
    text        = Log in twin
    color       = rgba(ffffff, 0.55)
    font_size   = 16
    font_family = JetBrainsMono Nerd Font
    position    = 0, 100
    halign      = center
    valign      = bottom
}
